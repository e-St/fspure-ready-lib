# Dev / integration CI — unreleased FSharp.PureAnalyzer from e-St GitHub Packages.
# Runs on the `dev` branch (and PRs targeting dev). Not the customer-facing path.
name: CI (dev)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fspure_analyzer_version:
        description: "Version or 'latest' (newest on GitHub Packages, including prerelease)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  FSPURE_ANALYZER_CHANNEL: github-latest
  REQUIRE_GITHUB_PACKAGES: "1"
  FspureAnalyzerVersion: ${{ github.event.inputs.fspure_analyzer_version || 'latest' }}
  FspureReadyLibVersion: 0.1.0-preview.1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-pack-assert-dev:
    name: Build against GitHub Packages analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Auth e-St GitHub Packages
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/use-github-packages.sh

      - name: Resolve analyzer version
        run: |
          set -euo pipefail
          VER="$(bash scripts/resolve-fspure-analyzer-version.sh)"
          echo "FspureAnalyzerVersion=$VER" >> "$GITHUB_ENV"
          echo "Dev channel using FSharp.PureAnalyzer $VER from GitHub Packages"

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack + assert embed + consumer diagnostics
        run: |
          set -euo pipefail
          bash scripts/ci-build-and-assert.sh

      - name: Assert nupkg embed
        run: |
          set -euo pipefail
          NUPKG="$(ls artifacts/packages/Fspure.ReadyLib*.nupkg | head -1)"
          bash scripts/assert-nupkg-embed.sh "$NUPKG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fspure-ready-lib-artifacts-dev
          path: |
            artifacts/packages/
            artifacts/consumer.sarif
            artifacts/analyzer-stdout.txt
          if-no-files-found: warn

  gate:
    name: Dev CI gate
    runs-on: ubuntu-latest
    needs: build-pack-assert-dev
    steps:
      - run: echo "dev CI green (unreleased FSharp.PureAnalyzer from GitHub Packages)"
