# Dev / integration CI — unreleased FSharp.PureAnalyzer from e-St GitHub Packages.
#
# Package access: grant fspure-ready-lib Actions access on the FSharp.PureAnalyzer
# package, OR set secret FSPURE_PACKAGES_READ_TOKEN (packages:read).
name: CI (dev)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  # Fired by e-St/fspure after a CI analyzer package is published (avoids race).
  repository_dispatch:
    types: [fspure-analyzer-published]
  workflow_dispatch:
    inputs:
      fspure_analyzer_version:
        description: "Leave empty/latest for newest GH Packages build, or pin e.g. 0.3.2-ci.12.abc1234"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  FSPURE_ANALYZER_CHANNEL: github-latest
  REQUIRE_GITHUB_PACKAGES: "1"
  FspureReadyLibVersion: 0.1.0-preview.1
  # Prefer packages-read PAT (sees monorepo-published packages); else GITHUB_TOKEN.
  GITHUB_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
  FSPURE_PACKAGES_READ_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN }}

jobs:
  build-pack-assert-dev:
    name: Build against GitHub Packages analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # repository_dispatch checks out default branch; force dev tip.
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Auth e-St GitHub Packages
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/use-github-packages.sh

      - name: Resolve analyzer (require -ci prerelease)
        id: analyzer
        run: |
          set -euo pipefail
          export FSPURE_ANALYZER_CHANNEL=github-latest
          export REQUIRE_GITHUB_PACKAGES=1

          INPUT="${{ github.event.inputs.fspure_analyzer_version }}"
          DISPATCH_VER="${{ github.event.client_payload.version }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
             && -n "${INPUT}" && "${INPUT}" != "latest" ]]; then
            export FspureAnalyzerVersion="${INPUT}"
            export FSPURE_ANALYZER_PINNED=1
            echo "Dispatch pin: $INPUT"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" \
               && -n "${DISPATCH_VER}" ]]; then
            export FspureAnalyzerVersion="${DISPATCH_VER}"
            export FSPURE_ANALYZER_PINNED=1
            echo "repository_dispatch pin: $DISPATCH_VER"
          else
            # Critical: do not inherit a release pin from the environment.
            unset FspureAnalyzerVersion || true
            export FspureAnalyzerVersion=latest
            export FSPURE_ANALYZER_PINNED=0
          fi

          VER="$(bash scripts/resolve-fspure-analyzer-version.sh)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "FspureAnalyzerVersion=$VER" >> "$GITHUB_ENV"
          # Pack step may re-call resolve; keep the concrete version.
          echo "FSPURE_ANALYZER_PINNED=1" >> "$GITHUB_ENV"

          echo "### Dev analyzer" >> "$GITHUB_STEP_SUMMARY"
          echo "Using **FSharp.PureAnalyzer \`$VER\`** from GitHub Packages." >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VER" == "0.3.2" ]] || [[ "$VER" != *-ci.* ]]; then
            echo "::error::Need a -ci.* prerelease (got \`$VER\`). nuget.org/mirrored 0.3.2 has no Phase 3 embed targets."
            echo "1) Ensure e-St/fspure workflow **Publish analyzer to GitHub Packages (CI)** succeeded"
            echo "2) Grant fspure-ready-lib package Actions access, or set secret FSPURE_PACKAGES_READ_TOKEN"
            exit 1
          fi

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack + assert embed + consumer diagnostics
        env:
          FSPURE_ANALYZER_CHANNEL: github-latest
          REQUIRE_GITHUB_PACKAGES: "1"
          FSPURE_ANALYZER_PINNED: "1"
        run: |
          set -euo pipefail
          # FspureAnalyzerVersion is the concrete -ci.* version from GITHUB_ENV
          bash scripts/ci-build-and-assert.sh

      - name: Assert nupkg embed
        run: |
          set -euo pipefail
          NUPKG="$(ls artifacts/packages/Fspure.ReadyLib*.nupkg | head -1)"
          bash scripts/assert-nupkg-embed.sh "$NUPKG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fspure-ready-lib-artifacts-dev
          path: |
            artifacts/packages/
            artifacts/consumer.sarif
            artifacts/analyzer-stdout.txt
          if-no-files-found: warn

  gate:
    name: Dev CI gate
    runs-on: ubuntu-latest
    needs: build-pack-assert-dev
    steps:
      - run: echo "dev CI green"
