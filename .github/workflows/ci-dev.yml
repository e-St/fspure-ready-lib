# Dev / integration CI — unreleased FSharp.PureAnalyzer from e-St GitHub Packages.
# Runs on the `dev` branch (and PRs targeting dev). Not the customer-facing path.
#
# Package access: GITHUB_TOKEN can only download packages from the same repo by
# default. Grant this repository access on the FSharp.PureAnalyzer package
# (GitHub → package → Package settings → Manage Actions access), OR set secret
# FSPURE_PACKAGES_READ_TOKEN (PAT with packages:read) on fspure-ready-lib.
name: CI (dev)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fspure_analyzer_version:
        description: "Pin a version, or leave 'latest' for newest GitHub Packages build"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  FSPURE_ANALYZER_CHANNEL: github-latest
  REQUIRE_GITHUB_PACKAGES: "1"
  FspureReadyLibVersion: 0.1.0-preview.1
  # Prefer a packages-read PAT if set (cross-repo); else Actions GITHUB_TOKEN.
  GITHUB_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
  FSPURE_PACKAGES_READ_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN }}

jobs:
  build-pack-assert-dev:
    name: Build against GitHub Packages analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Auth e-St GitHub Packages
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/use-github-packages.sh

      - name: Resolve analyzer version from GitHub Packages
        id: analyzer
        run: |
          set -euo pipefail
          # Only pass explicit pins from workflow_dispatch; push events use latest.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            export FspureAnalyzerVersion="${{ github.event.inputs.fspure_analyzer_version }}"
          else
            export FspureAnalyzerVersion=latest
          fi
          export FSPURE_ANALYZER_CHANNEL=github-latest
          export REQUIRE_GITHUB_PACKAGES=1
          VER="$(bash scripts/resolve-fspure-analyzer-version.sh)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "FspureAnalyzerVersion=$VER" >> "$GITHUB_ENV"
          echo "### Dev analyzer" >> "$GITHUB_STEP_SUMMARY"
          echo "Using **FSharp.PureAnalyzer $VER** from GitHub Packages (\`e-St\`)." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VER" == "0.3.2" ]]; then
            echo "::warning::Resolved 0.3.2 only. Publish a newer -ci.* package from e-St/fspure (workflow Publish analyzer to GitHub Packages), and ensure this repo can read the package."
          fi

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack + assert embed + consumer diagnostics
        env:
          FSPURE_ANALYZER_CHANNEL: github-latest
          REQUIRE_GITHUB_PACKAGES: "1"
        run: |
          set -euo pipefail
          # FspureAnalyzerVersion is already a concrete version from GITHUB_ENV
          bash scripts/ci-build-and-assert.sh

      - name: Assert nupkg embed
        run: |
          set -euo pipefail
          NUPKG="$(ls artifacts/packages/Fspure.ReadyLib*.nupkg | head -1)"
          bash scripts/assert-nupkg-embed.sh "$NUPKG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fspure-ready-lib-artifacts-dev
          path: |
            artifacts/packages/
            artifacts/consumer.sarif
            artifacts/analyzer-stdout.txt
          if-no-files-found: warn

  gate:
    name: Dev CI gate
    runs-on: ubuntu-latest
    needs: build-pack-assert-dev
    steps:
      - run: echo "dev CI green (FSharp.PureAnalyzer from GitHub Packages)"
