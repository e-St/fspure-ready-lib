# Customer-facing CI (main / master / PRs into main).
#
# Analyzer source: e-St GitHub Packages (-ci builds with Phase 3 embed targets).
# nuget.org 0.3.2 is analyzer-only (no build/); switch back to release channel
# after a Phase 3 FSharp.PureAnalyzer is published to nuget.org.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fspure_analyzer_version:
        description: "Pin FSharp.PureAnalyzer -ci.* version, or leave empty for latest"
        required: false
        default: ""

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  FSPURE_ANALYZER_CHANNEL: github-latest
  REQUIRE_GITHUB_PACKAGES: "1"
  FspureReadyLibVersion: 0.1.0-preview.1
  GITHUB_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
  FSPURE_PACKAGES_READ_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN }}

jobs:
  build-pack-assert:
    name: Build, pack, assert embed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Auth e-St GitHub Packages
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/use-github-packages.sh

      - name: Resolve analyzer (require -ci prerelease)
        id: analyzer
        run: |
          set -euo pipefail
          export FSPURE_ANALYZER_CHANNEL=github-latest
          export REQUIRE_GITHUB_PACKAGES=1

          INPUT="${{ github.event.inputs.fspure_analyzer_version }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
             && -n "${INPUT}" && "${INPUT}" != "latest" ]]; then
            export FspureAnalyzerVersion="${INPUT}"
            export FSPURE_ANALYZER_PINNED=1
          else
            unset FspureAnalyzerVersion || true
            export FspureAnalyzerVersion=latest
            export FSPURE_ANALYZER_PINNED=0
          fi

          VER="$(bash scripts/resolve-fspure-analyzer-version.sh)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "FspureAnalyzerVersion=$VER" >> "$GITHUB_ENV"
          echo "FSPURE_ANALYZER_PINNED=1" >> "$GITHUB_ENV"

          if [[ "$VER" == "0.3.2" ]] || [[ "$VER" != *-ci.* ]]; then
            echo "::error::Need a -ci.* prerelease (got \`$VER\`). nuget.org 0.3.2 has no Phase 3 embed targets."
            exit 1
          fi

      - name: Restore tools (fsharp-analyzers 0.35.0)
        run: dotnet tool restore

      - name: Pack + assert embed + consumer diagnostics
        env:
          FSPURE_ANALYZER_CHANNEL: github-latest
          REQUIRE_GITHUB_PACKAGES: "1"
          FSPURE_ANALYZER_PINNED: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/ci-build-and-assert.sh

      - name: Assert nupkg embed
        run: |
          set -euo pipefail
          NUPKG="$(ls artifacts/packages/Fspure.ReadyLib*.nupkg | head -1)"
          bash scripts/assert-nupkg-embed.sh "$NUPKG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fspure-ready-lib-artifacts-main
          path: |
            artifacts/packages/
            artifacts/consumer.sarif
            artifacts/analyzer-stdout.txt
          if-no-files-found: warn

  gate:
    name: Customer CI gate
    runs-on: ubuntu-latest
    needs: build-pack-assert
    steps:
      - run: echo "main CI green (Phase 3 analyzer from GitHub Packages)"
