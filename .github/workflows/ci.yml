# Customer-facing CI (main / master / PRs into main).
# Uses released FSharp.PureAnalyzer from nuget.org only.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fspure_analyzer_version:
        description: "Released FSharp.PureAnalyzer version (empty = Directory.Packages.props default / nuget.org latest stable if 'latest')"
        required: false
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  FSPURE_ANALYZER_CHANNEL: release
  FspureReadyLibVersion: 0.1.0-preview.1

jobs:
  build-pack-assert:
    name: Build, pack, assert embed (nuget.org release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pin analyzer version (optional dispatch override)
        if: ${{ github.event.inputs.fspure_analyzer_version != '' }}
        run: echo "FspureAnalyzerVersion=${{ github.event.inputs.fspure_analyzer_version }}" >> "$GITHUB_ENV"

      - name: Restore tools (fsharp-analyzers 0.35.0)
        run: dotnet tool restore

      - name: Pack + assert embed + consumer diagnostics
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/ci-build-and-assert.sh

      - name: Assert nupkg embed
        run: |
          set -euo pipefail
          NUPKG="$(ls artifacts/packages/Fspure.ReadyLib*.nupkg | head -1)"
          bash scripts/assert-nupkg-embed.sh "$NUPKG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fspure-ready-lib-artifacts-release
          path: |
            artifacts/packages/
            artifacts/consumer.sarif
            artifacts/analyzer-stdout.txt
          if-no-files-found: warn

  gate:
    name: Customer CI gate
    runs-on: ubuntu-latest
    needs: build-pack-assert
    steps:
      - run: echo "main CI green (released FSharp.PureAnalyzer from nuget.org)"
