# Publish a prerelease Fspure.ReadyLib package.
# Packs with a Phase 3 analyzer from GitHub Packages (-ci builds).
name: Publish prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview.2)"
        required: true
        default: "0.1.0-preview.1"
      fspure_analyzer_version:
        description: "FSharp.PureAnalyzer -ci.* version (empty = latest GH Packages)"
        required: false
        default: ""
      destination:
        description: "nuget.org | github | both"
        required: true
        default: "github"

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  FSPURE_ANALYZER_CHANNEL: github-latest
  REQUIRE_GITHUB_PACKAGES: "1"
  GITHUB_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
  FSPURE_PACKAGES_READ_TOKEN: ${{ secrets.FSPURE_PACKAGES_READ_TOKEN }}

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Auth e-St GitHub Packages
        run: |
          set -euo pipefail
          chmod +x src/scripts/*.sh
          bash src/scripts/use-github-packages.sh

      - name: Resolve analyzer + pack
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          chmod +x src/scripts/*.sh

          export FSPURE_ANALYZER_CHANNEL=github-latest
          export REQUIRE_GITHUB_PACKAGES=1

          INPUT="${{ github.event.inputs.fspure_analyzer_version }}"
          if [[ -n "${INPUT}" && "${INPUT}" != "latest" ]]; then
            export FspureAnalyzerVersion="${INPUT}"
            export FSPURE_ANALYZER_PINNED=1
          else
            unset FspureAnalyzerVersion || true
            export FspureAnalyzerVersion=latest
            export FSPURE_ANALYZER_PINNED=0
          fi

          ANALYZER_VERSION="$(bash src/scripts/resolve-fspure-analyzer-version.sh)"
          echo "Building against FSharp.PureAnalyzer $ANALYZER_VERSION"

          if [[ "$ANALYZER_VERSION" == "0.3.2" || "$ANALYZER_VERSION" != *-ci.* ]]; then
            echo "ERROR: need a -ci.* Phase 3 analyzer (got $ANALYZER_VERSION)" >&2
            exit 1
          fi

          # Full pack + embed + consumer asserts, then re-pack at the publish version.
          export FspureAnalyzerVersion="$ANALYZER_VERSION"
          export FSPURE_ANALYZER_PINNED=1
          export FspureReadyLibVersion="${{ github.event.inputs.version }}"
          bash src/scripts/ci-build-and-assert.sh

          # Ensure publish output is the requested version (script already packs it).
          ls -lh artifacts/packages

      - name: Assert embed in nupkg
        run: |
          set -euo pipefail
          NUPKG="$(ls artifacts/packages/Fspure.ReadyLib*.nupkg | head -1)"
          bash src/scripts/assert-nupkg-embed.sh "$NUPKG"

      - name: Publish to GitHub Packages
        if: ${{ github.event.inputs.destination == 'github' || github.event.inputs.destination == 'both' }}
        run: |
          set -euo pipefail
          # Push only ReadyLib (not a local analyzer nupkg if any).
          for f in artifacts/packages/Fspure.ReadyLib*.nupkg; do
            dotnet nuget push "$f" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done

      - name: Publish to nuget.org
        if: ${{ github.event.inputs.destination == 'nuget.org' || github.event.inputs.destination == 'both' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "ERROR: NUGET_API_KEY secret is not set." >&2
            exit 1
          fi
          for f in artifacts/packages/Fspure.ReadyLib*.nupkg; do
            dotnet nuget push "$f" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/packages/Fspure.ReadyLib*.nupkg
